[package]
name = "zkcredit-sequencer"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sp1-sdk = "5.0.8"
zkcredit-program = { path = "../sp1-program" }
hex = "0.4"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
sp1-build = "5.0.8"
